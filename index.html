<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>LET'S GO — 108 minutes</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="./assets/fonts/fonts.css">
<script type="importmap">
{ "imports": {
    "three": "./node_modules/three/build/three.module.js",
    "three/addons/": "./node_modules/three/examples/jsm/"
} }
</script>
<style>
  html, body { margin: 0; background: #070b12; color: #d9d2c0; font: 13px 'Martian Mono', monospace; overflow: hidden; }
  #out { display: block; width: 1920px; height: 1080px; background: #0E1726; }
  body.preview #stage { position: fixed; inset: 0 0 64px 0; display: grid; place-items: center; }
  body.preview #out { width: auto; height: auto; max-width: 100%; max-height: 100%; aspect-ratio: 16/9; box-shadow: 0 20px 80px rgba(0,0,0,.6); }
  #ui { display: none; }
  body.preview #ui { display: flex; position: fixed; left: 0; right: 0; bottom: 0; height: 64px; align-items: center; gap: 12px; padding: 0 16px; background: #0b111b; border-top: 1px solid #1d2838; }
  #ui button { background: #1b2638; color: #efe6d2; border: 1px solid #2c3a50; padding: 6px 10px; font: inherit; cursor: pointer; border-radius: 4px; }
  #ui button.on { background: #F26B1D; color: #111; border-color: #F26B1D; }
  #scrub { flex: 1; accent-color: #F26B1D; }
  #tc { min-width: 190px; text-align: right; }
  #parts { display: flex; gap: 4px; }
  #info { position: fixed; top: 8px; left: 12px; font-size: 11px; color: #8DA2AE; pointer-events: none; }
</style>
</head>
<body>
<div id="stage"><canvas id="out" width="1920" height="1080"></canvas></div>
<div id="info"></div>
<div id="ui">
  <button id="play">▶ play</button>
  <button id="score" title="render & play the procedural score with the VO">score: off</button>
  <div id="parts"></div>
  <input id="scrub" type="range" min="0" max="1" step="1" value="0">
  <span id="tc">00:00.00</span>
</div>
<audio id="vo" src="./assets/audio/voiceover.mp3" preload="auto"></audio>
<script type="module" src="./src/main.js"></script>
</body>
</html>
